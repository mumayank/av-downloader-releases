<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AV Downloader social card</title>
<style>
  @font-face { font-family: 'Bricolage Grotesque'; src: url('assets/fonts/bricolage-grotesque.woff2') format('woff2'); font-weight: 200 800; font-display: block; }
  @font-face { font-family: 'Instrument Sans'; src: url('assets/fonts/instrument-sans.woff2') format('woff2'); font-weight: 400 700; font-display: block; }
  @font-face { font-family: 'DM Mono'; src: url('assets/fonts/dm-mono-500.woff2') format('woff2'); font-weight: 500; font-display: block; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #F3EEE2; color: #0C1A2A;
    font-family: 'Instrument Sans', Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .card { position: relative; width: 1200px; height: 630px; overflow: hidden; padding: 64px 70px; display: flex; gap: 40px; }
  .card::before {
    content: ""; position: absolute; right: -120px; top: -180px; width: 640px; height: 640px; border-radius: 50%;
    background: radial-gradient(circle, rgba(46, 196, 182, 0.3) 0%, transparent 68%);
    opacity: .55;
  }
  .card::after {
    content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .06; mix-blend-mode: multiply;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 220 220' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.5'/%3E%3C/svg%3E");
  }
  .copy { position: relative; z-index: 2; width: 610px; display: flex; flex-direction: column; }
  .eyebrow { display: flex; align-items: center; gap: 10px; font-family: 'DM Mono', monospace; font-size: 15px; letter-spacing: .14em; text-transform: uppercase; color: #526170; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #0F9D8F; }
  h1 { margin: 22px 0 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 74px; line-height: .95; letter-spacing: -.055em; font-weight: 700; }
  .mark { position: relative; display: inline-block; z-index: 0; isolation: isolate; padding: 0 .04em; }
  .mark::before { content: ""; position: absolute; z-index: -1; inset: 6% -4% 0; background: #2EC4B6; border-radius: 6px 12px 8px 14px; transform: rotate(-1.4deg); }
  .sub { margin: 26px 0 0; font-size: 24px; line-height: 1.4; color: #1E1A17; max-width: 560px; }
  .chips { display: flex; gap: 10px; margin-top: auto; padding-bottom: 8px; }
  .chip { display: inline-flex; align-items: center; height: 38px; padding: 0 16px; border-radius: 999px; border: 1px solid rgba(12,26,42,.2); font-family: 'DM Mono', monospace; font-size: 14px; letter-spacing: .06em; text-transform: uppercase; }
  .chip--fill { background: #2EC4B6; border-color: transparent; font-weight: 500; }
  .art { position: relative; z-index: 2; width: 420px; margin-left: auto; display: flex; align-items: center; justify-content: center; }
  .phone { width: 340px; padding: 10px; border-radius: 52px; background: #0C1A2A; box-shadow: 0 40px 90px -30px rgba(11,26,41,.55), 0 0 0 1px rgba(46,196,182,.16); transform: rotate(6deg); }
  .screen { border-radius: 42px; overflow: hidden; background: #000; }
  .screen img { display: block; width: 100%; height: auto; }
  .badge { position: absolute; left: 8px; bottom: 54px; z-index: 3; transform: rotate(-6deg); background: #FBF8F0; border: 1px solid rgba(12,26,42,.16); border-radius: 18px; padding: 12px 16px; box-shadow: 0 18px 40px -20px rgba(11,26,41,.45); }
  .badge b { display: block; font-family: 'Bricolage Grotesque', sans-serif; font-size: 19px; letter-spacing: -.02em; }
  .badge span { display: block; font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #526170; margin-top: 3px; }
</style>
</head>
<body>
  <div class="card" id="og">
    <div class="copy">
      <p class="eyebrow"><span class="dot"></span> A personal sideload tool for Android</p>
      <h1>Copy a link.<br>Tap the <span class="mark">bubble</span>.</h1>
      <p class="sub">The media, or a stripped reader-view page, lands in Telegram or WhatsApp. No store, no account, no tracking.</p>
      <div class="chips">
        <span class="chip chip--fill">Android 8</span>
        <span class="chip">Direct APK</span>
        <span class="chip">No account</span>
      </div>
    </div>
    <div class="art">
      <div class="phone"><div class="screen"><img id="shot" src="assets/img/hero-front.webp" alt=""></div></div>
      <div class="badge"><b>AV Downloader</b><span>3.1.4</span></div>
    </div>
  </div>
</body>
</html>
